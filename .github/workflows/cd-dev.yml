name: CD · dev

# Every merge to main reaches dev, automatically and without ceremony. That is
# the point of dev: it is where main is proven continuously, so a release is a
# promotion of something already running rather than a leap.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", "LICENSE", "NOTICE"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  deployments: write

concurrency:
  group: cd-dev
  cancel-in-progress: false      # never interrupt a deploy in flight

jobs:
  version:
    name: Stamp the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - id: v
        # A dev build is a pre-release of the next patch, so it sorts before any
        # real release and can never be mistaken for one.
        run: |
          last=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          base=${last:-v0.0.0}; base=${base#v}
          IFS=. read -r maj min patch <<<"$base"
          echo "version=${maj}.${min}.$((patch + 1))-dev.$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  image:
    name: Build and publish
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: VERSION=${{ needs.version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}:dev
            ghcr.io/${{ github.repository }}:${{ needs.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [version, image]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
      wrangler_env: dev
      version: ${{ needs.version.outputs.version }}
    secrets: inherit
