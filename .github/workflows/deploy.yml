name: Deploy

# A reusable deployment, called by the environment pipelines rather than
# triggered directly. One definition means every environment runs the same
# steps, in the same order, with the same smoke test.
on:
  workflow_call:
    inputs:
      environment:
        description: "GitHub environment, e.g. dev"
        required: true
        type: string
      wrangler_env:
        description: "Wrangler environment in deploy/cloudflare/wrangler.toml"
        required: true
        type: string
      version:
        description: "Version being deployed, for the build stamp and the annotation"
        required: true
        type: string
      run_migrations:
        description: "Apply pending migrations before deploying"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v7

      # 0. Infrastructure first, so a deploy can never reach for a Hyperdrive
      #    config that does not exist yet.
      #
      #    This applies without asking. That is a deliberate trade: the manual
      #    gate lives on the GitHub environment wrapping this job, so production
      #    still waits for a reviewer, and dev is meant to move without one.
      #    The plan is still posted on every pull request that touches
      #    deploy/terraform, which is where infrastructure review belongs.
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.3
          terraform_wrapper: false

      - name: Apply infrastructure
        id: infra
        working-directory: deploy/terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_R2_SECRET_ACCESS_KEY }}
          TF_VAR_cloudflare_api_token: ${{ secrets.TF_CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.TF_CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.TF_CLOUDFLARE_ZONE_ID }}
          TF_VAR_database: ${{ secrets.TF_DATABASE_DEV }}
          TF_IN_AUTOMATION: "true"
        run: |
          terraform init \
            -backend-config=envs/${{ inputs.environment }}.backend.hcl \
            -backend-config="endpoints={\"s3\":\"https://${TF_VAR_cloudflare_account_id}.r2.cloudflarestorage.com\"}" \
            -lockfile=readonly
          terraform apply -auto-approve -input=false \
            -var-file=envs/${{ inputs.environment }}.tfvars
          echo "hyperdrive_id=$(terraform output -raw hyperdrive_id)" >> "$GITHUB_OUTPUT"

      # The binding ID is written in, never committed. wrangler.toml keeps a
      # placeholder so the file stays honest about which values are per
      # environment, and so a stale ID cannot be deployed from an old branch.
      - name: Bind Hyperdrive
        run: |
          test -n "${{ steps.infra.outputs.hyperdrive_id }}" || {
            echo "terraform produced no hyperdrive_id"; exit 1; }
          sed -i \
            "s|set-after-creating-the-${{ inputs.wrangler_env }}-hyperdrive-config|${{ steps.infra.outputs.hyperdrive_id }}|" \
            deploy/cloudflare/wrangler.toml
          grep -A2 "env.${{ inputs.wrangler_env }}.hyperdrive" deploy/cloudflare/wrangler.toml

      # 1. Expand. Additive only, and compatible with the binary still running,
      #    so the deploy that follows can be rolled back without touching data.
      - uses: actions/setup-go@v7
        if: inputs.run_migrations
        with: { go-version: "1.27", cache: true }
      - name: Install goose
        if: inputs.run_migrations
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.24.1
      - name: Expand migration
        if: inputs.run_migrations
        env:
          GOOSE_DRIVER: postgres
          GOOSE_DBSTRING: ${{ secrets.DATABASE_URL }}
        run: |
          goose -dir migrations status
          goose -dir migrations up
          goose -dir migrations status

      # wrangler bundles the Worker with esbuild, which resolves imports from
      # node_modules, and wrangler-action installs nothing. Without this the
      # build fails on `Could not resolve "@cloudflare/containers"` -- after the
      # migration has already been applied.
      #
      # These steps were deleted by accident when the pre-deploy secret sync was
      # removed: they sat between the two markers that edit worked from, and
      # every deploy since has failed.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: deploy/cloudflare/package-lock.json
      - name: Install Worker dependencies
        working-directory: deploy/cloudflare
        run: npm ci

      # Capture before deployment AND secret sync: both create Worker revisions.
      # Without an explicit target, rollback can select this same release.
      - name: Remember pre-release Worker version
        id: prior
        working-directory: deploy/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --no-install wrangler deployments list --env ${{ inputs.wrangler_env }} --json > "$RUNNER_TEMP/marum-prior-deployments.json"
          node rollback-target.mjs < "$RUNNER_TEMP/marum-prior-deployments.json" >> "$GITHUB_OUTPUT"

      # 2. Deploy the code that reads both the old and the new schema.
      - name: Deploy Worker and container
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: deploy/cloudflare
          command: deploy --env ${{ inputs.wrangler_env }} --var VERSION:${{ inputs.version }}

      # Runtime secrets, pushed from the environment's GitHub secrets rather
      # than set by hand with `wrangler secret put`.
      #
      # This moves the app's own secrets into GitHub, which the original design
      # avoided. The reasoning changed: this same environment already holds
      # CLOUDFLARE_API_TOKEN, which can publish a Worker and therefore read
      # anything the Worker can. Keeping the bot token out of GitHub bought
      # nothing once that token was there, and cost a manual step per
      # environment -- which is the step that never gets repeated correctly.
      #
      # jq builds the JSON so a value containing a quote or newline cannot
      # break out of it, and the file never reaches the log.
      # Secrets are synced ONCE, and only after the deploy.
      #
      # There used to be a second sync before it, meant to cover the first-ever
      # run. It could never work: on a first run there is no script to attach a
      # secret to, and after any rollback Cloudflare refuses with
      #
      #   Secret edit failed. You attempted to modify a secret, but the latest
      #   version of your Worker isn't currently deployed. [code: 10215]
      #
      # because a rollback leaves the latest version undeployed. It was marked
      # continue-on-error, so it failed quietly on every deploy and taught
      # readers to ignore a red step.
      - name: Sync runtime secrets
        working-directory: deploy/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The container talks to Postgres directly. Hyperdrive's connection
          # string does not resolve inside a container sandbox -- see the
          # comment in worker/index.ts.
          MARUM_DATABASE_URL: ${{ secrets.MARUM_DATABASE_URL }}
          MARUM_BOT_TOKEN: ${{ secrets.MARUM_BOT_TOKEN }}
          MARUM_WEBHOOK_SECRET: ${{ secrets.MARUM_WEBHOOK_SECRET }}
          MARUM_SERVICE_TOKEN: ${{ secrets.MARUM_SERVICE_TOKEN }}
          MARUM_IDENTITY_KEY: ${{ secrets.MARUM_IDENTITY_KEY }}
          MARUM_ADMIN_USER: ${{ secrets.MARUM_ADMIN_USER }}
          MARUM_ADMIN_PASSWORD_HASH: ${{ secrets.MARUM_ADMIN_PASSWORD_HASH }}
          # The Mini App URL. It sat in the environment's secrets and was never
          # in this list, so the container ran with it empty: /add answered
          # "not available", nothing published the versioned menu button, and
          # Telegram kept opening the unversioned URL its webview had cached --
          # so every deploy looked like the old app from inside the chat.
          MARUM_MINIAPP_URL: ${{ secrets.MARUM_MINIAPP_URL }}
          WEBHOOK_PATH: ${{ secrets.WEBHOOK_PATH }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          PYROSCOPE_SERVER_ADDRESS: ${{ secrets.PYROSCOPE_SERVER_ADDRESS }}
          PYROSCOPE_BASIC_AUTH_USER: ${{ secrets.PYROSCOPE_BASIC_AUTH_USER }}
          PYROSCOPE_BASIC_AUTH_PASSWORD: ${{ secrets.PYROSCOPE_BASIC_AUTH_PASSWORD }}
        run: |
          # Without the form URL the bot has no form to offer, and the failure
          # surfaces to a user as a message, not to an operator as a red step.
          test -n "$MARUM_MINIAPP_URL" || {
            echo "::error::MARUM_MINIAPP_URL is not set in the ${{ inputs.environment }} environment"; exit 1; }
          jq -n '$ENV | with_entries(select(
                 (.key | startswith("MARUM_") or startswith("OTEL_")
                       or startswith("PYROSCOPE_") or . == "WEBHOOK_PATH")
                 and .value != ""))' > /tmp/secrets.json
          echo "syncing: $(jq -r 'keys | join(", ")' /tmp/secrets.json)"
          npx wrangler secret bulk /tmp/secrets.json --env ${{ inputs.wrangler_env }}
          rm -f /tmp/secrets.json

      # 3. Prove it works before anyone else finds out it does not.
      - name: Post-deploy smoke
        id: smoke
        env:
          # Lets the smoke ask Telegram what the bot published, so a container
          # that came up without its Mini App URL fails here and not in a chat.
          MARUM_BOT_TOKEN: ${{ secrets.MARUM_BOT_TOKEN }}
        run: ./deploy/cloudflare/smoke.sh "${{ vars.PUBLIC_URL }}" "${{ inputs.version }}"

      # 4. A failed smoke rolls the binary back, but only when a previous
      #    deployment exists. The schema stays expanded, which is safe precisely
      #    because it is backward compatible.
      - name: Roll back on failure
        if: failure() && steps.smoke.outcome == 'failure' && steps.prior.outputs.version_id != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: deploy/cloudflare
          command: rollback ${{ steps.prior.outputs.version_id }} --env ${{ inputs.wrangler_env }} --message smoke-failed --yes

      # Best-effort: a deploy is not less deployed because a marker is missing.
      # -f alone exits 22 on any HTTP error and hides the status, which made
      # every failure here look identical; the status and body are what say
      # whether the token is wrong (401), under-scoped (403), or the URL is off.
      # Grafana Cloud wants a STACK service-account token with annotations
      # write access here, not a cloud access policy token.
      - name: Annotate Grafana
        if: success() && vars.GRAFANA_URL != ''
        continue-on-error: true
        run: |
          code=$(curl -s -o /tmp/annotation.json -w '%{http_code}' -X POST \
            "${{ vars.GRAFANA_URL }}/api/annotations" \
            -H "Authorization: Bearer ${{ secrets.GRAFANA_TOKEN }}" \
            -H 'Content-Type: application/json' \
            -d "{\"tags\":[\"deploy\",\"${{ inputs.environment }}\"],\"text\":\"marum ${{ inputs.version }} → ${{ inputs.environment }}\"}")
          if [ "$code" -ge 300 ]; then
            echo "::warning::Grafana annotation failed: HTTP $code: $(head -c 300 /tmp/annotation.json)"
            exit 1
          fi
          echo "annotated: HTTP $code"
