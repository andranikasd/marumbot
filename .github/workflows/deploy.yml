name: Deploy

# A reusable deployment, called by the dev and production pipelines rather than
# triggered directly. One definition means dev genuinely rehearses production:
# the same steps, the same order, the same smoke test.
on:
  workflow_call:
    inputs:
      environment:
        description: "GitHub environment: dev or production"
        required: true
        type: string
      wrangler_env:
        description: "Wrangler environment in deploy/cloudflare/wrangler.toml"
        required: true
        type: string
      version:
        description: "Version being deployed, for the build stamp and the annotation"
        required: true
        type: string
      run_migrations:
        description: "Apply pending migrations before deploying"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v4

      # 0. Infrastructure first, so a deploy can never reach for a Hyperdrive
      #    config that does not exist yet.
      #
      #    This applies without asking. That is a deliberate trade: the manual
      #    gate lives on the GitHub environment wrapping this job, so production
      #    still waits for a reviewer, and dev is meant to move without one.
      #    The plan is still posted on every pull request that touches
      #    deploy/terraform, which is where infrastructure review belongs.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3
          terraform_wrapper: false

      - name: Apply infrastructure
        id: infra
        working-directory: deploy/terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_R2_SECRET_ACCESS_KEY }}
          TF_VAR_cloudflare_api_token: ${{ secrets.TF_CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.TF_CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.TF_CLOUDFLARE_ZONE_ID }}
          TF_VAR_database: ${{ inputs.environment == 'production' && secrets.TF_DATABASE_PRODUCTION || secrets.TF_DATABASE_DEV }}
          TF_IN_AUTOMATION: "true"
        run: |
          terraform init \
            -backend-config=envs/${{ inputs.environment }}.backend.hcl \
            -backend-config="endpoints={\"s3\":\"https://${TF_VAR_cloudflare_account_id}.r2.cloudflarestorage.com\"}" \
            -lockfile=readonly
          terraform apply -auto-approve -input=false \
            -var-file=envs/${{ inputs.environment }}.tfvars
          echo "hyperdrive_id=$(terraform output -raw hyperdrive_id)" >> "$GITHUB_OUTPUT"

      # The binding ID is written in, never committed. wrangler.toml keeps a
      # placeholder so the file stays honest about which values are per
      # environment, and so a stale ID cannot be deployed from an old branch.
      - name: Bind Hyperdrive
        run: |
          test -n "${{ steps.infra.outputs.hyperdrive_id }}" || {
            echo "terraform produced no hyperdrive_id"; exit 1; }
          sed -i \
            "s|set-after-creating-the-${{ inputs.wrangler_env }}-hyperdrive-config|${{ steps.infra.outputs.hyperdrive_id }}|" \
            deploy/cloudflare/wrangler.toml
          grep -A2 "env.${{ inputs.wrangler_env }}.hyperdrive" deploy/cloudflare/wrangler.toml

      # 1. Expand. Additive only, and compatible with the binary still running,
      #    so the deploy that follows can be rolled back without touching data.
      - uses: actions/setup-go@v5
        if: inputs.run_migrations
        with: { go-version: "1.25", cache: true }
      - name: Install goose
        if: inputs.run_migrations
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.24.1
      - name: Expand migration
        if: inputs.run_migrations
        env:
          GOOSE_DRIVER: postgres
          GOOSE_DBSTRING: ${{ secrets.DATABASE_URL }}
        run: |
          goose -dir migrations status
          goose -dir migrations up
          goose -dir migrations status

      # Runtime secrets, pushed from the environment's GitHub secrets rather
      # than set by hand with `wrangler secret put`.
      #
      # This moves the app's own secrets into GitHub, which the original design
      # avoided. The reasoning changed: this same environment already holds
      # CLOUDFLARE_API_TOKEN, which can publish a Worker and therefore read
      # anything the Worker can. Keeping the bot token out of GitHub bought
      # nothing once that token was there, and cost a manual step per
      # environment -- which is the step that never gets repeated correctly.
      #
      # jq builds the JSON so a value containing a quote or newline cannot
      # break out of it, and the file never reaches the log.
      - name: Sync runtime secrets (first run may have no Worker yet)
        continue-on-error: true
        working-directory: deploy/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MARUM_BOT_TOKEN: ${{ secrets.MARUM_BOT_TOKEN }}
          MARUM_WEBHOOK_SECRET: ${{ secrets.MARUM_WEBHOOK_SECRET }}
          MARUM_SERVICE_TOKEN: ${{ secrets.MARUM_SERVICE_TOKEN }}
          MARUM_IDENTITY_KEY: ${{ secrets.MARUM_IDENTITY_KEY }}
          MARUM_ADMIN_USER: ${{ secrets.MARUM_ADMIN_USER }}
          MARUM_ADMIN_PASSWORD_HASH: ${{ secrets.MARUM_ADMIN_PASSWORD_HASH }}
          WEBHOOK_PATH: ${{ secrets.WEBHOOK_PATH }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
        run: |
          jq -n '$ENV | with_entries(select(
                 (.key | startswith("MARUM_") or startswith("OTEL_") or . == "WEBHOOK_PATH")
                 and .value != ""))' > /tmp/secrets.json
          echo "syncing: $(jq -r 'keys | join(", ")' /tmp/secrets.json)"
          npx wrangler secret bulk /tmp/secrets.json --env ${{ inputs.wrangler_env }}
          rm -f /tmp/secrets.json

      # wrangler bundles the Worker with esbuild, which resolves imports from
      # node_modules. wrangler-action does not install anything, so without this
      # the build fails on `Could not resolve "@cloudflare/containers"` -- and it
      # fails at deploy time, after the migration has already been applied.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: deploy/cloudflare/package-lock.json
      - name: Install Worker dependencies
        working-directory: deploy/cloudflare
        run: npm ci

      # 2. Deploy the code that reads both the old and the new schema.
      - name: Deploy Worker and container
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: deploy/cloudflare
          command: deploy --env ${{ inputs.wrangler_env }} --var VERSION:${{ inputs.version }}

      # Runtime secrets, pushed from the environment's GitHub secrets rather
      # than set by hand with `wrangler secret put`.
      #
      # This moves the app's own secrets into GitHub, which the original design
      # avoided. The reasoning changed: this same environment already holds
      # CLOUDFLARE_API_TOKEN, which can publish a Worker and therefore read
      # anything the Worker can. Keeping the bot token out of GitHub bought
      # nothing once that token was there, and cost a manual step per
      # environment -- which is the step that never gets repeated correctly.
      #
      # jq builds the JSON so a value containing a quote or newline cannot
      # break out of it, and the file never reaches the log.
      - name: Sync runtime secrets
        working-directory: deploy/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MARUM_BOT_TOKEN: ${{ secrets.MARUM_BOT_TOKEN }}
          MARUM_WEBHOOK_SECRET: ${{ secrets.MARUM_WEBHOOK_SECRET }}
          MARUM_SERVICE_TOKEN: ${{ secrets.MARUM_SERVICE_TOKEN }}
          MARUM_IDENTITY_KEY: ${{ secrets.MARUM_IDENTITY_KEY }}
          MARUM_ADMIN_USER: ${{ secrets.MARUM_ADMIN_USER }}
          MARUM_ADMIN_PASSWORD_HASH: ${{ secrets.MARUM_ADMIN_PASSWORD_HASH }}
          WEBHOOK_PATH: ${{ secrets.WEBHOOK_PATH }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
        run: |
          jq -n '$ENV | with_entries(select(
                 (.key | startswith("MARUM_") or startswith("OTEL_") or . == "WEBHOOK_PATH")
                 and .value != ""))' > /tmp/secrets.json
          echo "syncing: $(jq -r 'keys | join(", ")' /tmp/secrets.json)"
          npx wrangler secret bulk /tmp/secrets.json --env ${{ inputs.wrangler_env }}
          rm -f /tmp/secrets.json

      # 3. Prove it works before anyone else finds out it does not.
      - name: Post-deploy smoke
        id: smoke
        run: ./deploy/cloudflare/smoke.sh "${{ vars.PUBLIC_URL }}"

      # 4. A failed smoke rolls the binary back. The schema stays expanded,
      #    which is safe precisely because it is backward compatible.
      - name: Roll back on failure
        if: failure() && steps.smoke.outcome == 'failure'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: deploy/cloudflare
          command: rollback --env ${{ inputs.wrangler_env }} --message "post-deploy smoke failed"

      - name: Annotate Grafana
        if: success() && vars.GRAFANA_URL != ''
        continue-on-error: true
        run: |
          curl -sf -X POST "${{ vars.GRAFANA_URL }}/api/annotations" \
            -H "Authorization: Bearer ${{ secrets.GRAFANA_TOKEN }}" \
            -H 'Content-Type: application/json' \
            -d "{\"tags\":[\"deploy\",\"${{ inputs.environment }}\"],\"text\":\"marum ${{ inputs.version }} → ${{ inputs.environment }}\"}"
