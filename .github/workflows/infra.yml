# Infrastructure changes.
#
# Terraform is separated from the deploy pipeline on purpose. A deploy runs on
# every merge and must be fast and reversible; an infrastructure change is rare,
# is reviewed as a plan before anyone can approve it, and can take a database
# offline. Putting them in one workflow makes the frequent case slow and the
# dangerous case routine.
#
#   pull request   plan only, posted as a comment, no credentials that can write
#   manual run     apply, gated by the same environment protection as a deploy
#
# There is no automatic apply. Nothing here should ever change without a person
# having read the plan first.

name: Infrastructure

on:
  pull_request:
    paths:
      - "deploy/terraform/**"
      - ".github/workflows/infra.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to apply to"
        required: true
        type: choice
        options: [dev]
      action:
        description: "plan leaves everything untouched; apply changes real infrastructure"
        required: true
        default: plan
        type: choice
        options: [plan, apply]

concurrency:
  # Never two applies against one state file. Not cancel-in-progress: killing an
  # apply half way through is how state ends up describing something that does
  # not exist.
  group: infra-${{ github.event.inputs.environment || github.head_ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"

jobs:
  plan:
    name: Plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    strategy:
      # One environment for now. Production was removed until there is a
      # product worth shipping there; the matrix stays so a second entry is a
      # two-line change rather than a restructure.
      fail-fast: false
      matrix:
        include:
          - environment: dev
            database_secret: TF_DATABASE_DEV

    # Deliberately no `environment:`. An environment is a deploy gate, and both
    # gates restrict which refs may deploy -- so declaring one here means every
    # pull request is refused before Terraform runs, and the plan that exists to
    # inform the review can never be produced. The gate belongs on apply.
    #
    # Terraform's own credentials are therefore repository secrets, prefixed
    # TF_. They are a different, narrower token than the deploy one: Hyperdrive,
    # R2 and zone settings, with no ability to publish a Worker.
    defaults:
      run:
        working-directory: deploy/terraform

    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3
          terraform_wrapper: false

      # Formatting needs no credentials, so it is checked either way.
      - name: Check formatting
        run: terraform fmt -check -recursive -diff

      - name: Validate
        run: |
          terraform init -backend=false -input=false >/dev/null
          terraform validate

      # Until the TF_* repository secrets exist, there is no state to compare
      # against and no plan to produce. Say so plainly rather than failing: a
      # red cross here would read as a broken pipeline when it actually means
      # "not configured yet", and that is the kind of noise people learn to
      # ignore before it turns into a real failure.
      - name: Are the infrastructure secrets configured?
        id: configured
        run: |
          if [ -n "${{ secrets.TF_R2_ACCESS_KEY_ID }}" ] \
             && [ -n "${{ secrets.TF_CLOUDFLARE_API_TOKEN }}" ] \
             && [ -n "${{ secrets[matrix.database_secret] }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.database_secret }} or the shared TF_* secrets are not set; formatting and validation ran, the plan did not." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Init
        if: steps.configured.outputs.ready == 'true'
        run: |
          terraform init \
            -backend-config=envs/${{ matrix.environment }}.backend.hcl \
            -backend-config="endpoints={\"s3\":\"https://${AWS_ACCOUNT}.r2.cloudflarestorage.com\"}" \
            -lockfile=readonly
        env:
          AWS_ACCOUNT: ${{ secrets.TF_CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_R2_SECRET_ACCESS_KEY }}

      - name: Plan
        id: plan
        if: steps.configured.outputs.ready == 'true'
        # A plan that fails must fail the job, but a plan that finds changes
        # must not. -detailed-exitcode separates the two: 1 is an error, 2 is
        # "there are changes", 0 is "nothing to do".
        run: |
          set +e
          terraform plan -no-color -lock=false -detailed-exitcode \
            -var-file=envs/${{ matrix.environment }}.tfvars \
            -out=tfplan > plan.txt 2>&1
          code=$?
          set -e
          echo "changes=$([ $code -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          tail -c 60000 plan.txt
          [ $code -ne 1 ]
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_R2_SECRET_ACCESS_KEY }}
          TF_VAR_cloudflare_api_token: ${{ secrets.TF_CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.TF_CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.TF_CLOUDFLARE_ZONE_ID }}
          TF_VAR_database: ${{ secrets[matrix.database_secret] }}

      - name: Comment the plan on the pull request
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const env = '${{ matrix.environment }}'
            const marker = `<!-- tfplan:${env} -->`
            let body
            try {
              const raw = fs.readFileSync('deploy/terraform/plan.txt', 'utf8')
              // Keep well under the 65536-character comment limit.
              const text = raw.length > 55000 ? raw.slice(-55000) : raw
              const changes = '${{ steps.plan.outputs.changes }}' === 'true'
              body = `${marker}\n### Terraform plan · \`${env}\`\n\n` +
                (changes ? '**This plan changes infrastructure.**\n\n' : 'No changes.\n\n') +
                '```terraform\n' + text + '\n```'
            } catch {
              const ready = '${{ steps.configured.outputs.ready }}' === 'true'
              body = ready
                ? `${marker}\n### Terraform plan · \`${env}\`\n\nThe plan did not run. See the job log.`
                : `${marker}\n### Terraform plan · \`${env}\`\n\nSkipped: \`${{ matrix.database_secret }}\` (or the shared \`TF_*\` secrets) is not configured yet. ` +
                  `Formatting and \`terraform validate\` both ran and passed. ` +
                  `See [deploy/terraform/README.md](../blob/main/deploy/terraform/README.md).`
            }
            const {owner, repo} = context.repo
            const issue_number = context.issue.number
            const existing = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number})
            const mine = existing.find(c => c.body.startsWith(marker))
            if (mine) {
              await github.rest.issues.updateComment({owner, repo, comment_id: mine.id, body})
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body})
            }

  apply:
    name: ${{ github.event.inputs.action }} · ${{ github.event.inputs.environment }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    # Here the environment IS wanted: it is the approval gate. production
    # requires an approver, so an apply cannot start until a person has read the
    # plan. A manual run also has a real branch behind it, so the ref policy is
    # satisfiable in a way a pull request merge ref is not.
    environment: ${{ github.event.inputs.environment }}

    defaults:
      run:
        working-directory: deploy/terraform

    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3
          terraform_wrapper: false

      - name: Init
        run: |
          terraform init \
            -backend-config=envs/${{ github.event.inputs.environment }}.backend.hcl \
            -backend-config="endpoints={\"s3\":\"https://${AWS_ACCOUNT}.r2.cloudflarestorage.com\"}" \
            -lockfile=readonly
        env:
          AWS_ACCOUNT: ${{ secrets.TF_CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_R2_SECRET_ACCESS_KEY }}

      - name: Plan
        # Always planned to a file first, and apply is given that file. Applying
        # a saved plan is what makes the approved change and the executed change
        # the same change.
        run: |
          terraform plan -no-color \
            -var-file=envs/${{ github.event.inputs.environment }}.tfvars \
            -out=tfplan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_R2_SECRET_ACCESS_KEY }}
          TF_VAR_cloudflare_api_token: ${{ secrets.TF_CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.TF_CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.TF_CLOUDFLARE_ZONE_ID }}
          TF_VAR_database: ${{ secrets.TF_DATABASE_DEV }}

      - name: Apply
        if: github.event.inputs.action == 'apply'
        run: terraform apply -no-color -auto-approve tfplan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_R2_SECRET_ACCESS_KEY }}
          TF_VAR_cloudflare_api_token: ${{ secrets.TF_CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.TF_CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.TF_CLOUDFLARE_ZONE_ID }}
          TF_VAR_database: ${{ secrets.TF_DATABASE_DEV }}

      - name: Report the Hyperdrive binding
        if: github.event.inputs.action == 'apply'
        run: |
          {
            echo "### Applied to \`${{ github.event.inputs.environment }}\`"
            echo
            echo "Put this in \`deploy/cloudflare/wrangler.toml\`:"
            echo
            echo '```toml'
            terraform output -raw wrangler_hint
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_R2_SECRET_ACCESS_KEY }}
