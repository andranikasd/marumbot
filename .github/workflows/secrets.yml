# A credential-shaped string must never reach this repository.
#
# GitGuardian and GitHub's own scanner both catch these, but they catch them
# after the push -- and a bot token that was public for a minute is a bot token
# that has to be revoked. This runs on the pull request, before merge, where the
# fix is still free.
#
# It exists because exactly this happened: a live Telegram bot token was
# committed inside a test whose subject is credential handling, and the first
# thing to notice was a scanner.

name: Secrets

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    name: No credentials in the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Look for credential-shaped strings
        run: |
          set -uo pipefail
          fail=0

          # A Telegram bot token is <digits>:<35 chars of base64url>. The
          # fabricated one used in tests is excluded by name, not by shape:
          # anything that merely looks fake is still a token if it is real.
          # Tracked files only. A local .env legitimately holds real values and
          # is gitignored; scanning the working tree would flag it forever and
          # train everyone to ignore this check.
          if git ls-files -z | xargs -0 grep -InE '[0-9]{8,12}:AA[A-Za-z0-9_-]{30,}' \
             | grep -v 'AAFakeTokenForTestsOnlyNotARealBot'; then
            echo "::error::a Telegram bot token appears in the tree"
            fail=1
          fi

          # Grafana and Cloudflare tokens, and PEM private keys.
          for pattern in 'glc_[A-Za-z0-9+/=]{40,}' 'glsa_[A-Za-z0-9_]{30,}' \
                         'cfut_[A-Za-z0-9]{40,}' 'BEGIN [A-Z ]*PRIVATE KEY'; do
            if git ls-files -z | grep -zv '^\.github/workflows/secrets\.yml$' \
               | xargs -0 grep -InE "$pattern"; then
              echo "::error::a credential matching /$pattern/ appears in the tree"
              fail=1
            fi
          done

          if [ "$fail" -eq 0 ]; then
            echo "no credential-shaped strings found"
          fi
          exit $fail
