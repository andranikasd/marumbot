name: CD · production

# Redeploying production out of band: rolling forward to a version that is
# already released, or re-running a deploy that failed after the release itself
# succeeded.
#
# The normal path is not here. A release created by the Release workflow is
# published by GITHUB_TOKEN, and GitHub does not trigger workflows from events
# raised by that token, so `on: release: published` would never fire for it.
# The release pipeline therefore chains the production deploy itself.
#
# The trigger below still fires for a release a person creates by hand in the
# UI, which is a real path worth keeping.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to deploy, e.g. 0.2.1"
        required: true

permissions:
  contents: read
  deployments: write

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  version:
    name: Resolve the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          v="${{ github.event.inputs.version }}"
          [ -n "$v" ] || v="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$v' is not a version"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  deploy:
    needs: version
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      wrangler_env: production
      version: ${{ needs.version.outputs.version }}
    secrets: inherit
