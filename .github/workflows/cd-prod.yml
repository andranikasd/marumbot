name: CD · prod

# No production environment exists. Retained for future manual use only;
# v2.0.0 targets development through cd-dev.yml after full implementation.
# Tags and releases must never trigger this workflow automatically.
on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prod
      wrangler_env: prod
      version: ${{ github.ref_name }}
    secrets: inherit
