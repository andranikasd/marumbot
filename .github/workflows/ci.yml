name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: "${{ env.GO_VERSION }}", cache: true }
      - name: gofumpt
        run: |
          go run mvdan.cc/gofumpt@v0.7.0 -l . | tee /tmp/fmt
          test ! -s /tmp/fmt
      # v7 or later: v6 refuses golangci-lint v2 outright. The pinned version
      # must also be built with a Go at least as new as the module targets -
      # v2.0.2 is built with 1.24 and refuses to load a 1.25 config.
      - uses: golangci/golangci-lint-action@v9
        with: { version: v2.13.1 }

  vet:
    name: Vet and vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: "${{ env.GO_VERSION }}", cache: true }
      - run: go vet ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: "${{ env.GO_VERSION }}", cache: true }
      # Downloading modules is a network operation and the proxy is not always
      # well. A failed zip fetch aborted the whole run with "stream error:
      # INTERNAL_ERROR; received from peer" and reported it as eight failing
      # packages, which reads as a broken branch rather than a bad minute.
      #
      # Retried here so the flake is absorbed where it happens, and so a real
      # dependency problem still fails after three honest attempts.
      - name: Download modules
        run: |
          for attempt in 1 2 3; do
            go mod download && exit 0
            echo "module download attempt $attempt failed; retrying"
            sleep 5
          done
          echo "::error::could not download modules after 3 attempts"
          exit 1

      # -race always: a data race that only appears in production is a race
      # nobody can reproduce.
      - run: go test -race -count=1 ./...

  web:
    name: Mini App bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - name: Mini App transport regressions
        run: node internal/adapter/in/miniapp/transport_ui_test.mjs
      - name: Reconciliation retry lifecycle
        run: node internal/adapter/in/miniapp/reconciliation_ui_test.mjs
      - name: Payment retry lifecycle
        run: node internal/adapter/in/miniapp/payment_ui_test.mjs
      - name: Smoke rollout regressions
        run: python3 deploy/cloudflare/smoke_test.py
      # node --check misses real syntax errors in this codebase (a stray
      # Armenian identifier parsed as a property shorthand); esbuild parses
      # the whole module graph the way a browser will, and fails the build
      # the way the browser fails the user.
      - run: |
          cd internal/adapter/in/miniapp/web
          npx -y esbuild js/main.js --bundle --format=esm --outfile=/dev/null

  determinism-arm:
    name: Same answer on arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with: { go-version: "${{ env.GO_VERSION }}", cache: true }
      # The canonical report hash is committed. amd64 computes it in the test
      # job; this job recomputes it on arm64. A difference means a platform-
      # dependent code path reached money.
      - run: go test ./internal/determinism/

  core-is-pure:
    name: Engine imports no I/O
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: "${{ env.GO_VERSION }}", cache: true }
      # The engine must stay publishable on its own. If it ever imports the
      # application, a driver or a clock, this stops compiling - which is a
      # better error message than any lint rule.
      - name: Build the engine alone
        run: |
          mkdir -p /tmp/purecheck && cd /tmp/purecheck
          go mod init purecheck
          go mod edit -replace "github.com/andranikasd/marumbot=$GITHUB_WORKSPACE"
          cat > main.go <<'GO'
          package main

          import (
            "fmt"

            "github.com/andranikasd/marumbot/pkg/core/money"
          )

          func main() {
            a, _ := money.FromMajor(1_840_000, money.AMD)
            i, _ := money.Accrue(a, money.RateFromPercent(16, 0), 31, money.Actual365, money.DefaultAMDPolicy)
            fmt.Println(i)
          }
          GO
          go mod tidy && go run .

  migrations:
    name: Migrations are reversible
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: marum
          POSTGRES_PASSWORD: marum
          POSTGRES_DB: marum
        options: >-
          --health-cmd "pg_isready -U marum" --health-interval 5s
          --health-timeout 3s --health-retries 10
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: "${{ env.GO_VERSION }}", cache: true }
      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.24.1
      # up, down, up. The cheap half of the reversibility guarantee; the
      # valuable half is the previous release still working against the
      # expanded schema, which the release workflow checks.
      - name: up, down, up
        env:
          GOOSE_DRIVER: postgres
          GOOSE_DBSTRING: postgres://marum:marum@localhost:5432/marum?sslmode=disable
        run: |
          goose -dir migrations up
          goose -dir migrations down
          goose -dir migrations down
          goose -dir migrations up
          goose -dir migrations status

  store:
    name: Store against a real schema
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: marum
          POSTGRES_PASSWORD: marum
          POSTGRES_DB: marum
        options: >-
          --health-cmd "pg_isready -U marum" --health-interval 5s
          --health-timeout 3s --health-retries 10
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: "${{ env.GO_VERSION }}", cache: true }
      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.24.1
      - name: Migrate
        env:
          GOOSE_DRIVER: postgres
          GOOSE_DBSTRING: postgres://marum:marum@localhost:5432/marum?sslmode=disable
        run: goose -dir migrations up
      # The store maps SQL columns to struct fields by position; only a query
      # run against the real schema can prove the two agree. The unit suite
      # cannot see a scan drift, and the worst audit finding was exactly one.
      - name: Store integration tests
        env:
          TEST_DATABASE_URL: postgres://marum:marum@localhost:5432/marum?sslmode=disable
        run: go test -race -count=1 ./internal/adapter/out/postgres/

  edge:
    name: Worker and wrangler config
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: deploy/cloudflare }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm, cache-dependency-path: deploy/cloudflare/package-lock.json }
      - run: npm ci || npm install
      - name: Type-check the Worker
        run: npx tsc --noEmit
      # A wrangler config that does not parse is otherwise only discovered at
      # deploy time, which is the worst moment to discover it.
      # --containers-rollout=none: this check is about the config and the
      # Worker bundle resolving, and the image is already built by its own job.
      # Without it the dry run insists on building the container too.
      - name: Both environments resolve
        run: |
          npx wrangler deploy --env dev        --dry-run --containers-rollout=none --outdir /tmp/dev

  image:
    name: Image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
