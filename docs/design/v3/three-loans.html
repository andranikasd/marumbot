function loanCard(l,full=false){const a=d.actions.find(a=>a.loan===l.name&&a.kind==='instalment');return '<section class="card"><button class="loan-button" data-loan="'+l.name+'"><span class="title"><span class="badge">'+icon(loanIcons[l.name])+'</span><span><strong>'+esc(loanEdits[l.name].nickname)+'</strong><small>'+l.rate+'% yearly</small></span></span><span>›</span></button><div class="subamount">'+m(l.balance)+'</div>'+(full?row('Next required',m(a.amount))+'<small>'+date(a.on)+'</small>':'<small>Balance as of '+date(loanEdits[l.name].asOf)+'</small>')+(l.name==='Phone'?'<div class="pill">First extra-payment target</div>':'')+'<div class="loan-tools"><button data-edit-loan="'+l.name+'">Edit loan</button><button data-balance-loan="'+l.name+'">Update balance</button></div></section>'}

else if(screen==='Loans'){html='<h1>Your loans</h1><p class="label">Starting balances · 15 Jan 2026</p>'+loans.map(l=>loanCard(l,true)).join('')+card('Total balance','<div class="amount">'+m(loans.reduce((sum,l)=>sum+l.balance,0))+'</div><small>Sample user-entered balances, not bank verified.</small>')}
else if(screen==='Loan'){const l=loans.find(l=>l.name===loan),a=d.actions.find(a=>a.loan===loan&&a.kind==='instalment');html='<div class="page-title"><h1>'+esc(loanEdits[loan].nickname)+'</h1>'+editLink('Edit loan','Edit loan')+'</div>'+go('Update balance','Update balance','balance-action')+card('Appearance','<label for="loan-icon" class="label">Loan icon</label><select id="loan-icon" style="display:block;width:100%;margin-top:8px;padding:12px;background:var(--raised);color:var(--text);border:1px solid var(--line);border-radius:8px;font:inherit">'+[['Loans','Bank (default)'],['Car','Car'],['Home','Home'],['Phone','Phone'],['Activity','Document'],['Budget','Wallet']].map(([v,t])=>'<option value="'+v+'" '+(loanIcons[loan]===v?'selected':'')+'>'+t+'</option>').join('')+'</select><small>You choose the icon.</small>')+card('Starting balance','<div class="amount">'+m(l.balance)+'</div><small>As of 15 Jan 2026 · Sample balance</small>')+card('Next required payment',row('Amount',m(a.amount))+row('Due date',date(a.on)))+card('Loan terms',row('Annual nominal rate',l.rate+'%')+row('Maturity',date(loanEdits[loan].maturity))+row('Method','Annuity')+'<details><summary>Calculation rules</summary><p>Actual/365. No fees. Extra payments reduce principal. These are synthetic test terms.</p></details>')+go('Plan','See in payment plan')}
else if(screen==='Budget'){html='<div class="page-title"><h1>Monthly budget</h1>'+editLink('Edit budget','Edit budget')+'</div>'+card('Your limit','<div class="amount">'+m(demoBudget)+'</div><small>Cash arrives on day '+demoPayday+'</small>'+row('Protected reserve',m(demoReserve)))+card('First cycle · February 2026','<div class="bar"><i style="width:'+100*first.required/d.budget+'%"></i><i style="width:'+100*first.extra/d.budget+'%"></i></div>'+row('Required payments',m(first.required))+row('Optional extra',m(first.extra))+row('Fees',m(first.fees))+row('Total outflow',m(first.required+first.extra+first.fees))+row('Carried cash',m(first.cash)))+card('Where it goes',first.loans.map(l=>row(l.name+' loan',m(l.paid))).join(''))+'<details><summary>Demo assumptions</summary><p>No separate reserve or one-time cash. This plan/5 example treats the budget as arriving cash. V3 will check funding and spending limits separately.</p></details>'+go('Plan','View plan')}
else if(screen==='Plan'){html='<h1>Your plan</h1>'+card('Projected debt-free date','<div class="amount">'+date(d.payoff)+'</div>'+row('Interest saved*',m(d.minimum_interest-d.interest))+'<small>*Versus minimum-only payments.</small>')+card('First cycle payments',d.actions.map(a=>'<div class="action"><span>'+a.loan+' loan<small>'+date(a.on)+' · '+(a.kind==='extra'?'Optional extra':'Required')+'</small></span><b>'+m(a.amount)+'</b></div>').join(''))+card('Projected balances','<div id="balance-chart"></div><label for="cycle" class="label">Explore a projected cycle</label><input id="cycle" type="range" min="0" max="'+(d.months.length-1)+'" value="'+cycle+'"><div id="projection"></div>')+card('Monthly payments','<small>Projected outflow · AMD / month</small><div id="payments-chart"></div><div id="payments-values"></div>')+card('Monthly interest','<small>Same months · AMD / month</small><div id="interest-chart"></div><div id="interest-values"></div><details><summary>What is compared?</summary><p>Green follows this plan. The dashed line shows interest if only required payments were made. Both use the same sample loans and dates.</p><p>Charts show the active plan’s horizon. Required-only payments continue beyond it. These are projections; no interest has been recorded as actually paid.</p></details>')+card('Payoff milestones',d.months.flatMap(m=>m.loans.filter(l=>l.cleared).map(l=>'<div class="action"><span>'+l.name+' loan closed<small>Projected · cycle starting '+date(m.on)+'</small></span></div>')).join(''))+'<details><summary>How it was calculated</summary><p>'+d.engine+' · '+d.policies+' policies tested. Proven best under this sample’s conditions: '+d.eligibility+'.</p><p>Projected interest '+m(d.interest)+'. Minimum-only finish '+date(d.minimum_payoff)+'.</p></details>'+go('Budget','View budget')}
else if(screen==='Activity'){html='<h1>Activity</h1>'+card('No recorded payments','<div class="empty">'+icon('Activity')+'<p>The plan is a projection.</p><small>No actual payments have been recorded in this demo.</small></div>')+go('Plan','See planned payments')}
else{html='<h1>More</h1><div class="menu">'+go('Budget',icon('Budget')+' Budget','')+go('Loans',icon('Loans')+' Loans','')+go('Plan',icon('Plan')+' Plan','')+'</div><details open><summary>About this example</summary><p>Three synthetic loans from the existing engine test. Starting date: 15 January 2026. This is a clickable design preview, not a connected account.</p></details>'}
if(['Edit budget','Edit loan','Update balance'].includes(screen))html=editScreen();
if(planOutdated&&!['Edit budget','Edit loan','Update balance'].includes(screen))html='<div class="stale" role="status">'+esc(notice)+'. Plan needs recalculation.<details><summary>About the figures</summary><p>The charts and payment schedule still show the original sample. This preview does not calculate a new plan after edits.</p></details></div>'+html;
$('view').innerHTML=html;
$('edit-form')?.addEventListener('submit',saveEdit);$('cancel-edit')?.addEventListener('click',()=>{screen=history.pop()||'Home';render()});
document.querySelectorAll('[data-edit-loan]').forEach(b=>b.onclick=()=>{loan=b.dataset.editLoan;navigate('Edit loan')});document.querySelectorAll('[data-balance-loan]').forEach(b=>b.onclick=()=>{loan=b.dataset.balanceLoan;navigate('Update balance')});$('back').style.visibility=history.length?'visible':'hidden';$('nav').innerHTML=['Home','Plan','Loans','Activity','More'].map(s=>'<button data-go="'+s+'" '+(s===screen?'aria-current="page"':'')+'>'+icon(s)+'<span>'+s+'</span></button>').join('');document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>navigate(b.dataset.go));document.querySelectorAll('[data-loan]').forEach(b=>b.onclick=()=>{loan=b.dataset.loan;navigate('Loan')});if(screen==='Loan'){$('loan-icon').onchange=e=>{loanIcons[loan]=e.target.value;render()}}if(screen==='Plan'){$('cycle').oninput=()=>{cycle=Number($('cycle').value);projection()};projection()}}
// All charts use the same axes, line weights, selection marker and legend.
function chart(series,selected,labels){const max=Math.max(1,...series.flatMap(s=>s.values)),count=Math.max(...series.map(s=>s.values.length)),x=i=>36+i/Math.max(1,count-1)*274,y=v=>108-v/max*86;const tick=v=>new Intl.NumberFormat('en',{notation:'compact',maximumFractionDigits:1}).format(v/100);return '<svg class="chart" viewBox="0 0 330 142" role="img" aria-label="'+series.map(s=>s.name).join(' compared with ')+' over time"><line x1="36" y1="22" x2="310" y2="22" class="grid-line"/><line x1="36" y1="65" x2="310" y2="65" class="grid-line"/><line x1="36" y1="108" x2="310" y2="108" class="grid-line"/><text x="0" y="26">'+tick(max)+'</text><text x="8" y="112">0</text>'+series.map((s,j)=>'<path class="series-'+j+'" d="'+s.values.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ')+'"/><circle class="point-'+j+'" cx="'+x(selected)+'" cy="'+y(s.values[selected]||0)+'" r="3.5"/>').join('')+'<text x="36" y="135">'+labels[0]+'</text><text x="310" y="135" text-anchor="end">'+labels[1]+'</text></svg><div class="legend">'+series.map((s,j)=>'<span><i class="key-'+j+'"></i>'+s.name+'</span>').join('')+'</div>'}
const baselineByMonth=new Map(d.minimum_months.map(v=>[v.on.slice(0,7),v]));
function updateCharts(){const c=d.months[cycle],range=[month(d.months[0].on),month(d.months.at(-1).on)],base=baselineByMonth.get(c.on.slice(0,7));$('balance-chart').innerHTML=chart([{name:'Projected balance',values:[d.opening,...d.months.map(v=>v.owed)]}],cycle+1,[month(d.as_of),range[1]]);$('payments-chart').innerHTML=chart([{name:'Total payment',values:d.months.map(v=>v.required+v.extra+v.fees)},{name:'Required portion',values:d.months.map(v=>v.required)}],cycle,range);$('payments-values').innerHTML='<div class="label">'+month(c.on)+' · Projected</div>'+row('Required',m(c.required))+row('Extra',m(c.extra))+row('Fees',m(c.fees))+row('Total payment',m(c.required+c.extra+c.fees));$('interest-chart').innerHTML=chart([{name:'With this plan',values:d.months.map(v=>v.interest)},{name:'Required-only',values:d.months.map(v=>baselineByMonth.get(v.on.slice(0,7))?.interest||0)}],cycle,range);$('interest-values').innerHTML='<div class="label">'+month(c.on)+' · Projected interest</div>'+row('With this plan',m(c.interest))+row('Required-only',m(base.interest))+row('Difference this month',m(base.interest-c.interest));}

function projection(){const c=d.months[cycle];$('projection').innerHTML='<div class="label">After cycle starting '+date(c.on)+'</div><div class="subamount">'+m(c.owed)+'</div>'+c.loans.map(l=>row(l.name,m(l.owed))).join('')+'<small>Projected remaining principal, not actual progress.</small>';updateCharts()}
let chartChoice='Balance';
function compactLoan(l){return '<div class="compact-loan"><button class="loan-button" data-loan="'+l.name+'"><span class="title"><span class="badge">'+icon(loanIcons[l.name])+'</span><span><strong>'+esc(loanEdits[l.name].nickname)+'</strong><small>'+l.rate+'% · '+date(loanEdits[l.name].asOf)+'</small></span></span><b>'+m(l.balance)+'</b></button><button class="small-edit" data-edit-loan="'+l.name+'">Edit loan</button></div>'}
function layerNav(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>navigate(b.dataset.go));document.querySelectorAll('[data-loan]').forEach(b=>b.onclick=()=>{loan=b.dataset.loan;navigate('Loan')});document.querySelectorAll('[data-edit-loan]').forEach(b=>b.onclick=()=>{loan=b.dataset.editLoan;navigate('Edit loan')});}
function drawSelectedChart(){const c=d.months[cycle],base=baselineByMonth.get(c.on.slice(0,7)),range=[month(d.months[0].on),month(d.months.at(-1).on)];let series,selected=cycle,labels=range,values;
if(chartChoice==='Balance'){series=[{name:'Projected balance',values:[d.opening,...d.months.map(v=>v.owed)]}];selected++;labels=[month(d.as_of),range[1]];values=row('Remaining principal',m(c.owed))+c.loans.map(l=>row(l.name,m(l.owed))).join('')}
else if(chartChoice==='Monthly payments'){series=[{name:'Total',values:d.months.map(v=>v.required+v.extra+v.fees)},{name:'Required',values:d.months.map(v=>v.required)}];values=row('Required',m(c.required))+row('Extra',m(c.extra))+row('Fees',m(c.fees))+row('Total',m(c.required+c.extra+c.fees))}
else{series=[{name:'This plan',values:d.months.map(v=>v.interest)},{name:'Required-only',values:d.months.map(v=>baselineByMonth.get(v.on.slice(0,7))?.interest||0)}];values=row('This plan',m(c.interest))+row('Required-only',m(base.interest))+row('Difference',m(base.interest-c.interest))}
$('chosen-chart').innerHTML=chart(series,selected,labels);$('chosen-values').innerHTML=values;$('chosen-month').textContent=month(c.on)}
function render(){renderFull();let html=null;
if(screen==='Home')html='<div class="page-title"><h1>Home</h1><small>Sample portfolio</small></div><section class="card"><span class="label">Total balance · '+(planOutdated?'Edited demo':'15 Jan 2026')+'</span><div class="amount">'+m(loans.reduce((sum,l)=>sum+l.balance,0))+'</div><div class="summary-links"><button data-go="Budget"><small>Monthly budget</small><b>'+m(demoBudget)+'</b></button><button data-go="Plan"><small>Projected finish</small><b>'+(planOutdated?'Needs update':date(d.payoff))+'</b></button></div></section><section class="card"><div class="page-title"><h2>Your loans</h2><button class="small-edit" data-go="Loans">View all</button></div>'+loans.map(compactLoan).join('')+'</section>'+go('Plan','View payment plan');
else if(screen==='Loans')html='<div class="page-title"><h1>Your loans</h1><small>3 loans</small></div><section class="card">'+loans.map(compactLoan).join('')+'</section><section class="card">'+row('Total balance',m(loans.reduce((sum,l)=>sum+l.balance,0)))+'<small>Tap a loan for its terms and balance.</small></section>';
else if(screen==='Plan')html='<div class="page-title"><h1>Your plan</h1><button class="small-edit" data-go="Budget">Budget</button></div><div class="plan-strip"><span><small>Projected finish</small><b>'+(planOutdated?'Needs update':date(d.payoff))+'</b></span><span><small>Interest saved*</small><b>'+m(d.minimum_interest-d.interest)+'</b></span></div><section class="card chart-card"><label for="chart-choice" class="sr-only">Choose chart</label><select id="chart-choice">'+['Balance','Monthly payments','Monthly interest'].map(c=>'<option '+(c===chartChoice?'selected':'')+'>'+c+'</option>').join('')+'</select><div id="chosen-chart"></div><div class="cycle-label"><label for="chosen-cycle">Projected cycle</label><b id="chosen-month"></b></div><input type="range" id="chosen-cycle" min="0" max="'+(d.months.length-1)+'" value="'+cycle+'"><div id="chosen-values"></div></section><div class="layer-buttons">'+go('Payments','Payments','')+go('Milestones','Milestones','')+go('Plan details','Details','')+'</div><small>*Compared with required-only. Demo projections.</small>';
else if(screen==='Payments')html='<h1>Planned payments</h1><small>First cycle · February 2026</small>'+card('Payment schedule',d.actions.map(a=>'<div class="action"><span>'+a.loan+'<small>'+date(a.on)+' · '+(a.kind==='extra'?'Extra':'Required')+'</small></span><b>'+m(a.amount)+'</b></div>').join(''))+go('Plan','Back to plan');
else if(screen==='Milestones')html='<h1>Payoff milestones</h1>'+card('Projected closures',d.months.flatMap(c=>c.loans.filter(l=>l.cleared).map(l=>'<div class="action"><span>'+l.name+' loan<small>Cycle starting '+date(c.on)+'</small></span>'+icon('Plan')+'</div>')).join(''))+go('Plan','Back to plan');
else if(screen==='Plan details')html='<h1>Calculation details</h1>'+card('Original sample',row('Engine',d.engine)+row('Policies tested',d.policies)+row('Projected interest',m(d.interest))+row('Minimum-only finish',date(d.minimum_payoff))+'<p class="label">Fixed rates, no fees, Actual/365, extra payments credited to principal. Best under these sample conditions.</p><p class="label">Charts compare the same months. Required-only repayments continue after this plan ends. No actual payments are recorded.</p>')+go('Plan','Back to plan');
else if(screen==='Budget')html='<div class="page-title"><h1>Budget</h1>'+editLink('Edit budget','Edit budget')+'</div>'+card('Monthly limit','<div class="amount">'+m(demoBudget)+'</div><small>Available on day '+demoPayday+'</small>')+card('Original plan · first cycle',row('Required',m(first.required))+row('Optional extra',m(first.extra))+row('Fees',m(first.fees))+row('Total',m(first.required+first.extra+first.fees)))+go('Budget details','Cash and allocation','')+go('Plan','View plan');
else if(screen==='Budget details')html='<h1>Budget details</h1>'+card('Current demo settings',row('Cash arrival day',demoPayday)+row('Protected reserve',m(demoReserve)))+card('Original allocation',first.loans.map(l=>row(l.name,m(l.paid))).join(''))+'<p class="label">The original report treats budget as incoming cash. Saved edits do not recalculate this report.</p>'+go('Edit budget','Edit budget');
else if(screen==='Loan'){const l=loans.find(l=>l.name===loan),e=loanEdits[loan],a=d.actions.find(a=>a.loan===loan&&a.kind==='instalment');html='<div class="page-title"><h1>'+esc(e.nickname)+'</h1>'+editLink('Edit loan','Edit loan')+'</div>'+card('Balance','<div class="amount">'+m(l.balance)+'</div><small>As of '+date(e.asOf)+'</small>'+go('Update balance','Update balance'))+card('Loan details',row('Annual rate',l.rate+'%')+row('Maturity',date(e.maturity))+row('Original next payment',m(a.amount))+row('Due date',date(a.on)))+go('Plan','Open plan','')}
if(html!==null){$('view').innerHTML=(planOutdated?'<div class="stale compact-stale" role="status">Demo changed · Charts show the original plan.</div>':'')+html;layerNav();if(screen==='Plan'){$('chart-choice').onchange=e=>{chartChoice=e.target.value;drawSelectedChart()};$('chosen-cycle').oninput=e=>{cycle=Number(e.target.value);drawSelectedChart()};drawSelectedChart()}}
// Long editing forms expose one block at a time, retaining entered values.
if(['Edit loan','Edit budget'].includes(screen)){const blocks=[...$('edit-form').querySelectorAll(':scope > .card')];if(blocks.length>1){const tabs=document.createElement('div');tabs.className='form-tabs';let index=0;function show(i){index=i;blocks.forEach((b,j)=>b.hidden=j!==i);tabs.querySelectorAll('button').forEach((b,j)=>b.setAttribute('aria-pressed',String(j===i)))}blocks.forEach((b,i)=>{const btn=document.createElement('button');btn.type='button';btn.textContent=b.querySelector('h2').textContent;btn.onclick=()=>show(i);tabs.append(btn)});$('edit-form').prepend(tabs);show(0);$('edit-form').addEventListener('invalid',event=>{const i=blocks.findIndex(b=>b.contains(event.target));if(i>=0)show(i)},true)}}
$('view').scrollTop=0;
}

function navigate(s){history.push(screen);screen=s;render();window.scrollTo(0,0)}$('back').onclick=()=>{screen=history.pop()||'Home';render();window.scrollTo(0,0)};$('theme').onclick=()=>{$('theme').textContent=document.body.classList.toggle('light')?'Dark':'Light'};render();
</script></body></html>
