<body>
<!--
  The shell is empty on purpose. Every screen is a module under js/screens/
  that registers itself with the navigator: its markup, its tab, its load
  logic. Adding a screen is adding a file and one import in js/main.js;
  nothing here changes.
-->
<main id="view"></main>
<nav class="tabs" id="tabs"></nav>
<div class="toast" id="toast"></div>
<script type="module" src="js/main.js"></script>
</body>
