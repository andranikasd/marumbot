<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marum</title>
<link rel="stylesheet" href="styles.css">
<link rel="modulepreload" href="js/main.js">
<link rel="modulepreload" href="js/core.js">
<link rel="modulepreload" href="js/i18n.js">
<link rel="modulepreload" href="js/api.js">
<link rel="modulepreload" href="js/nav.js">
<link rel="modulepreload" href="js/screens/loans.js">
<link rel="modulepreload" href="js/screens/loan.js">
<link rel="modulepreload" href="js/screens/add.js">
<link rel="modulepreload" href="js/screens/budget.js">
<link rel="modulepreload" href="js/screens/budget-edit.js">
<link rel="modulepreload" href="js/screens/plan.js">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<!--
  The shell is empty on purpose. Every screen is a module under js/screens/
  that registers itself with the navigator: its markup, its tab or parent,
  its load logic. The app bar is owned by the navigator: a screen names its
  title and, if it wants one, its right-hand action.
-->
<header class="appbar" id="appbar">
  <button type="button" class="back" id="appbar-back" hidden aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
  <h1 id="appbar-title">Marum</h1>
  <button type="button" class="txt" id="appbar-action" hidden></button>
 <button type="button" class="language" id="appbar-language" aria-label="Language / Լեզու">Հայ / EN</button>
</header>
<div class="banner" id="offline" hidden><span id="offline-text"></span><button type="button" id="offline-retry"></button></div>
<main id="view"></main>
<nav class="tabs" id="tabs" aria-label="Screens"></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="build" id="build"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
