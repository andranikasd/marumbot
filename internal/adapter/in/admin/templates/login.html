{{define "content"}}
<div class="login">
  <div class="panel">
    <h1 class="brand"><span class="brand-mark" aria-hidden="true">M</span>Marum</h1>
    <p class="lead">Sign in to Marum administration.</p>
    {{if .Error}}<div class="note bad" role="alert">{{.Error}}</div>{{end}}
    <form method="post" action="/login" class="stack">
      <div><label for="user">User</label><input id="user" name="user" type="text" autocomplete="username" autofocus required></div>
      <div><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
      <label for="otp">Authenticator code</label><input id="otp" name="otp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" aria-describedby="otp-help">
      <p id="otp-help">First login? Leave the code blank to set up your authenticator. Otherwise, enter a fresh six-digit code.</p>
      <button type="submit">Sign in</button>
    </form>
  </div>
</div>
{{end}}
{{template "layout" .}}
