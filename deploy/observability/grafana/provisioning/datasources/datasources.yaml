apiVersion: 1

# Provisioned automatically: nothing here is clicked into existence, so a
# rebuilt stack comes back identical.
datasources:
  - name: Prometheus
    type: prometheus
    uid: marum-prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s
      # Exemplars are what turn a latency spike on a panel into the trace that
      # caused it.
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: marum-tempo

  - name: Loki
    type: loki
    uid: marum-loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        # A log line carries trace_id in structured metadata; this makes it a
        # link rather than something to copy by hand.
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          url: '${__value.raw}'
          datasourceUid: marum-tempo

  - name: Tempo
    type: tempo
    uid: marum-tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: marum-loki
        spanStartTimeShift: -2m
        spanEndTimeShift: 2m
        filterByTraceID: true
        tags: [{ key: service.name, value: service_name }]
      tracesToProfiles:
        datasourceUid: marum-pyroscope
        profileTypeId: process_cpu:cpu:nanoseconds:cpu:nanoseconds
        tags: [{ key: service.name, value: service_name }]
      serviceMap:
        datasourceUid: marum-prometheus
      nodeGraph: { enabled: true }
      streamingEnabled: { search: true }

  - name: Pyroscope
    type: grafana-pyroscope-datasource
    uid: marum-pyroscope
    access: proxy
    url: http://pyroscope:4040
