auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore: { store: inmemory }

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index: { prefix: index_, period: 24h }

limits_config:
  metric_aggregation_enabled: true
  allow_structured_metadata: true
  retention_period: 168h

  # Loki's OTLP defaults already do the right thing here: only a handful of
  # resource attributes become indexed labels (service.name, service.namespace,
  # service.instance.id, deployment.environment). Everything else - trace_id,
  # span_id, and any attribute a log call adds - is stored as structured
  # metadata, which is queryable and filterable without creating a stream per
  # value.
  #
  # The query API merges structured metadata into the `stream` map of its
  # response, which makes it look like a label when it is not. Check
  # /loki/api/v1/labels to see what is actually indexed.

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
