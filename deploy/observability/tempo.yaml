stream_over_http_enabled: true
server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc: { endpoint: 0.0.0.0:4317 }
        http: { endpoint: 0.0.0.0:4318 }

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 48h

storage:
  trace:
    backend: local
    wal: { path: /var/tempo/wal }
    local: { path: /var/tempo/blocks }

# Turns spans into RED metrics, so a service graph exists without the
# application emitting anything extra.
metrics_generator:
  registry:
    external_labels: { source: tempo }
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces

# This Tempo build reads the legacy flat overrides format; the nested
# `overrides.defaults` shape is rejected outright and the process will not
# start. Flat keys it is.
overrides:
  metrics_generator_processors: [service-graphs, span-metrics, local-blocks]

  # A service graph keyed on service.name collapses a monolith into one node.
  # Carrying the component as a span-metric dimension is what makes the pieces
  # inside it - webhook, worker, scheduler, sender, engine, store, admin -
  # separately measurable.
  metrics_generator_processor_span_metrics_dimensions:
    - marum.component
    - span.kind
    - status.code

  # peer.service turns the database into its own node on the graph instead of
  # an unlabelled edge leaving the application.
  metrics_generator_processor_service_graphs_peer_attributes:
    - peer.service
    - db.system
