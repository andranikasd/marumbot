# Marum on Cloudflare.
#
# Two environments, two bots, two domains, one codebase. Nothing is deployed
# to the top-level config: every deploy names an environment explicitly, so a
# stray `wrangler deploy` cannot reach production.
#
# The Worker is deliberately thin - authenticate, throttle, route. It holds no
# business logic and no database access, because a rule that needs loan data to
# evaluate belongs in Go where it can be tested without a socket. The container
# runs the same image as `make up`, so the self-hosting path stays real.

name = "marum"
main = "worker/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# No workers.dev URL: the bot is reached on its own domain, and an extra public
# hostname is an extra thing to secure.
workers_dev = false

[observability]
enabled = true

# ---------------------------------------------------------------------------
# dev - deployed automatically on every merge to main
# ---------------------------------------------------------------------------
[env.dev]
name = "marum-dev"

[env.dev.vars]
ENVIRONMENT = "dev"

# Reminders resolve to five minutes. The tick is idempotent and safe to run
# concurrently, so a missed one costs nothing.
[env.dev.triggers]
crons = ["*/5 * * * *"]

[[env.dev.routes]]
pattern = "dev.marum.loan"
custom_domain = true

# The admin interface, on its own hostname so that its root-relative links keep
# working. One level deep on purpose: the universal certificate covers
# *.marum.loan and no deeper, so admin.dev.marum.loan would fail TLS.
[[env.dev.routes]]
pattern = "admin-dev.marum.loan"
custom_domain = true

[[env.dev.containers]]
class_name = "MarumApp"
image = "../Dockerfile"
# The Dockerfile copies go.mod and the whole source tree, so it needs the
# repository root as its build context. wrangler otherwise defaults to the
# directory the Dockerfile sits in, which is deploy/ and has no go.mod --
# the build then fails on a cache-key checksum rather than a missing file.
image_build_context = "../.."
max_instances = 1
instance_type = "basic"

[[env.dev.durable_objects.bindings]]
name = "MARUM_APP"
class_name = "MarumApp"

[[env.dev.migrations]]
tag = "v1"
new_sqlite_classes = ["MarumApp"]

[[env.dev.hyperdrive]]
binding = "HYPERDRIVE"
id = "set-after-creating-the-dev-hyperdrive-config"

# ---------------------------------------------------------------------------
# Secrets are set per environment with:
#     wrangler secret put NAME --env dev
#     wrangler secret put NAME --env production
#
# They are never committed and never passed on a command line.
#
#   MARUM_BOT_TOKEN            a DIFFERENT bot per environment, always
#   MARUM_WEBHOOK_SECRET       must match what setWebhook registered
#   MARUM_SERVICE_TOKEN        Worker to container
#   MARUM_ADMIN_PASSWORD_HASH  absent means no admin interface at all
#   MARUM_IDENTITY_KEY         AES-GCM key for the identities table
#   MARUM_DATABASE_URL         through Hyperdrive
#   OTEL_EXPORTER_OTLP_HEADERS Grafana Cloud authorisation
# ---------------------------------------------------------------------------
