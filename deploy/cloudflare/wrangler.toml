# Marum on Cloudflare.
#
# The Worker is deliberately thin: it authenticates, throttles and routes. It
# holds no business logic and no database access, because a rule that needs
# loan data to evaluate belongs in Go where it can be tested without a socket.
#
# The application itself is the same container image that runs locally. Nothing
# about it is Cloudflare-shaped, so the self-hosting path stays real.

name = "marum"
main = "worker/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

workers_dev = false

[observability]
enabled = true

# Drains the outbox. Five minutes is the reminder resolution; the tick is
# idempotent and safe to run concurrently, so a missed one costs nothing.
[triggers]
crons = ["*/5 * * * *"]

[[containers]]
class_name = "MarumApp"
image = "./../Dockerfile"
max_instances = 2
instance_type = "basic"

[[durable_objects.bindings]]
name = "MARUM_APP"
class_name = "MarumApp"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MarumApp"]

# Pooling in front of the external Postgres, so a cold container does not pay
# for a TLS and Postgres handshake on every wake.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "set-me-after-creating-the-hyperdrive-config"

[vars]
ENVIRONMENT = "production"

# Secrets are set with `wrangler secret put`, never committed:
#   MARUM_BOT_TOKEN            from BotFather
#   MARUM_WEBHOOK_SECRET       matches what setWebhook registered
#   MARUM_SERVICE_TOKEN        Worker to container
#   MARUM_ADMIN_PASSWORD_HASH  admin interface; absent means no admin interface
#   MARUM_IDENTITY_KEY         AES-GCM key for the identities table
#   OTEL_EXPORTER_OTLP_HEADERS Grafana Cloud authorisation

[env.staging]
name = "marum-staging"
vars = { ENVIRONMENT = "staging" }
